<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f5f2" />
  <title>Train Position Guide</title>
  <style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#171717;background:#f5f5f2;font-synthesis:none}*{box-sizing:border-box}body{margin:0;background:#f5f5f2;color:#171717}button,input,select{font:inherit}button{cursor:pointer}.app{max-width:720px;margin:0 auto;padding:18px 14px 40px}.header{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:16px}h1{font-size:22px;line-height:1.2;margin:0 0 4px;letter-spacing:-.02em}h2{font-size:18px;margin:0}.muted{color:#747474;font-size:13px}.small{font-size:12px}.icon-button,.text-button,.pill,.segment-button,.swap-button{border:0;background:transparent;color:inherit}.icon-button,.text-button{padding:8px 10px}.segment{display:grid;grid-template-columns:1fr 1fr;background:#e7e7e3;border-radius:12px;padding:3px;margin-bottom:10px}.segment-button{padding:11px 8px;border-radius:9px;font-weight:650;font-size:14px}.segment-button.active{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.08)}.toolbar{display:flex;gap:7px;overflow-x:auto;padding-bottom:10px}.pill{white-space:nowrap;padding:8px 11px;border:1px solid #d7d7d2;border-radius:999px;background:#fff;font-size:13px}.pill.active{background:#171717;color:#fff;border-color:#171717}.panel{background:#fff;border:1px solid #deded9;border-radius:14px;padding:12px;margin-bottom:12px}.hidden{display:none!important}.field-row{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}label{display:grid;gap:6px;font-size:12px;color:#676767}input,select{min-width:0;width:100%;border:1px solid #d5d5cf;background:#fafaf8;color:#171717;border-radius:9px;padding:10px;font-size:15px;outline:none}input:focus,select:focus{border-color:#999}.swap-button{padding:10px 5px;font-size:18px}.primary{width:100%;margin-top:10px;border:0;border-radius:10px;padding:11px 12px;background:#171717;color:#fff;font-weight:650}.status-row{display:flex;align-items:center;justify-content:space-between;margin:4px 2px 8px}.status-row>div{display:flex;gap:8px;align-items:baseline;min-width:0}#routeTitle{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.notice{margin:8px 0;padding:10px 11px;border:1px solid #dfd6b8;background:#fffaf0;border-radius:10px;font-size:12px;line-height:1.55}.table-wrap{background:#fff;border:1px solid #deded9;border-radius:14px;overflow:hidden}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{padding:11px 9px;border-bottom:1px solid #ecece8;text-align:left;vertical-align:middle}th{font-size:11px;color:#777;font-weight:600;background:#fafaf8}td{font-size:13px}th:nth-child(1),td:nth-child(1){width:36%}th:nth-child(2),td:nth-child(2){width:31%}th:nth-child(3),td:nth-child(3){width:33%}tbody tr:last-child td{border-bottom:0}.time{font-variant-numeric:tabular-nums;font-weight:700;font-size:14px}.type{display:block;color:#555;font-size:11px;margin-top:2px}.paid{font-weight:650}.empty{text-align:center;color:#888;padding:28px 10px}.footnote{color:#7a7a7a;font-size:11px;line-height:1.55;margin:10px 3px}dialog{width:min(92vw,520px);border:0;border-radius:16px;padding:0;background:#fff;box-shadow:0 24px 70px rgba(0,0,0,.2)}dialog::backdrop{background:rgba(0,0,0,.25)}.settings{padding:16px;display:grid;gap:14px}.dialog-head{display:flex;align-items:center;justify-content:space-between}@media(max-width:420px){.app{padding-left:10px;padding-right:10px}th,td{padding:10px 7px}td{font-size:12px}.field-row{grid-template-columns:1fr auto 1fr}}
  </style>
</head>
<body>
  <main class="app">
    <header class="header">
      <div><h1>Train Position</h1><p id="nowLabel" class="muted"></p></div>
      <button id="settingsButton" class="icon-button" aria-label="設定">設定</button>
    </header>
    <section class="segment" aria-label="区間切替">
      <button class="segment-button active" data-route="kyoto-osaka">京都 → 大阪</button>
      <button class="segment-button" data-route="osaka-kyoto">大阪 → 京都</button>
    </section>
    <section class="toolbar">
      <button id="nearbyButton" class="pill active">現在時刻周辺</button>
      <button id="fullDayButton" class="pill">終日表示</button>
      <button id="customButton" class="pill">その他の区間</button>
    </section>
    <section id="customPanel" class="panel hidden">
      <div class="field-row">
        <label>出発駅<input id="fromInput" list="stationList" value="京都" /></label>
        <button id="swapButton" class="swap-button" aria-label="出発駅と到着駅を入れ替え">⇄</button>
        <label>到着駅<input id="toInput" list="stationList" value="大阪" /></label>
      </div>
      <datalist id="stationList"><option value="京都"></option><option value="西大路"></option><option value="桂川"></option><option value="向日町"></option><option value="長岡京"></option><option value="山崎"></option><option value="島本"></option><option value="高槻"></option><option value="摂津富田"></option><option value="JR総持寺"></option><option value="茨木"></option><option value="千里丘"></option><option value="岸辺"></option><option value="吹田"></option><option value="東淀川"></option><option value="新大阪"></option><option value="大阪"></option><option value="塚本"></option><option value="尼崎"></option><option value="立花"></option><option value="甲子園口"></option><option value="西宮"></option><option value="さくら夙川"></option><option value="芦屋"></option><option value="甲南山手"></option><option value="摂津本山"></option><option value="住吉"></option><option value="六甲道"></option><option value="摩耶"></option><option value="灘"></option><option value="三ノ宮"></option></datalist>
      <button id="applyCustomButton" class="primary">この区間を表示</button>
    </section>
    <section class="status-row"><div><strong id="routeTitle">京都 → 大阪</strong><span id="modeLabel" class="muted">現在時刻周辺</span></div><button id="refreshButton" class="text-button">更新</button></section>
    <section id="notice" class="notice hidden"></section>
    <section class="table-wrap"><table><thead><tr><th>時刻・種別</th><th>弱冷房車</th><th>有料座席</th></tr></thead><tbody id="trainRows"><tr><td colspan="3" class="empty">読み込み中…</td></tr></tbody></table></section>
    <p class="footnote">現在時刻周辺では、15分前から先の候補を表示。快速・普通も到着差が小さい場合は残します。</p>
  </main>
  <dialog id="settingsDialog"><form method="dialog" class="settings"><div class="dialog-head"><h2>データ設定</h2><button value="cancel" class="icon-button">閉じる</button></div><label>駅すぱあと APIキー<input id="apiKeyInput" type="password" autocomplete="off" placeholder="後から入力" /></label><p class="muted small">OpenAIなどのAI APIは使用しません。キーはこの端末のブラウザ内にのみ保存します。</p><label>現在時刻周辺の表示先<select id="futureMinutesSelect"><option value="60">60分先まで</option><option value="90" selected>90分先まで</option><option value="120">120分先まで</option></select></label><label>後続列車との到着差<select id="arrivalGapSelect"><option value="10">10分以内</option><option value="15" selected>15分以内</option><option value="20">20分以内</option></select></label><button id="saveSettingsButton" value="default" class="primary">保存</button></form></dialog>
  <script>
const E=id=>document.getElementById(id);const state={from:"京都",to:"大阪",mode:"nearby",futureMinutes:Number(localStorage.getItem("futureMinutes")||90),arrivalGap:Number(localStorage.getItem("arrivalGap")||15),apiKey:localStorage.getItem("ekispertApiKey")||""};const presets={"kyoto-osaka":["京都","大阪"],"osaka-kyoto":["大阪","京都"]};const asArray=v=>v==null?[]:Array.isArray(v)?v:[v];const parseIso=v=>{if(!v)return null;const d=new Date(v);return Number.isNaN(d.getTime())?null:d};const mins=(a,b)=>Math.round((b-a)/60000);const ymd=d=>`${d.getFullYear()}${String(d.getMonth()+1).padStart(2,"0")}${String(d.getDate()).padStart(2,"0")}`;const hm=d=>`${String(d.getHours()).padStart(2,"0")}${String(d.getMinutes()).padStart(2,"0")}`;const pretty=d=>new Intl.DateTimeFormat("ja-JP",{month:"numeric",day:"numeric",weekday:"short",hour:"2-digit",minute:"2-digit"}).format(d);function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}function normType(s){s=String(s||"");if(s.includes("新快速"))return"新快速";if(s.includes("快速"))return"快速";if(s.includes("普通")||s.includes("各駅"))return"普通";if(s.includes("特急"))return"特急";return s||"列車"}function paidType(s){s=String(s||"");if(/Aシート/.test(s))return"Aシート";if(/うれしート/.test(s))return"うれしート";return"—"}function weakMarker(type,paid,text=""){if(type==="普通")return"○2・○6";if(paid==="Aシート")return"△2・△11";if(/12両|12-car/i.test(text))return"△2・△11";if(/8両|8-car/i.test(text))return"△2・△7";if(type==="新快速"||type==="快速")return"△2・△7/11";return"要確認"}function paidMarker(paid,text=""){if(paid==="Aシート")return"△9（Aシート）";if(paid==="うれしート"){if(/12両|12-car/i.test(text))return"△12（うれしート）";if(/8両|8-car/i.test(text))return"△8（うれしート）";return"最後部（うれしート）"}return"—"}function courseToTrain(course){const route=course?.Route||course?.route||{},points=asArray(route.Point||route.point),lines=asArray(route.Line||route.line),line=lines.find(l=>!/徒歩|walk/i.test(String(l?.Name||l?.name||"")))||lines[0]||{};const text=[line.Name,line.name,line.Type?.text,line.trainName,line.Destination].filter(Boolean).join(" ");const dep=parseIso(line.DepartureState?.Datetime?.text)||parseIso(line.DepartureState?.Datetime)||parseIso(points[0]?.DateTime),arr=parseIso(line.ArrivalState?.Datetime?.text)||parseIso(line.ArrivalState?.Datetime)||parseIso(points.at(-1)?.DateTime);if(!dep)return null;const type=normType(text),paid=paidType(text);return{dep,arr:arr||new Date(dep.getTime()+30*60000),type,weak:weakMarker(type,paid,text),paid:paidMarker(paid,text),rawName:text}}async function search(from,to,baseTime,count=20){if(!state.apiKey)throw new Error("NO_API_KEY");const url=new URL("https://api.ekispert.jp/v1/json/search/course/extreme");url.searchParams.set("key",state.apiKey);url.searchParams.set("viaList",`${from}:${to}`);url.searchParams.set("date",ymd(baseTime));url.searchParams.set("time",hm(baseTime));url.searchParams.set("searchType","departure");url.searchParams.set("sort","ekispert");url.searchParams.set("answerCount",String(Math.min(20,count)));url.searchParams.set("searchCount",String(Math.min(20,count)));const r=await fetch(url);if(!r.ok)throw new Error(`API_${r.status}`);const data=await r.json();return asArray(data?.ResultSet?.Course||data?.resultSet?.course).map(courseToTrain).filter(Boolean)}async function nearby(){const now=new Date(),start=new Date(now.getTime()-15*60000),all=[];for(const t of [start,...(state.futureMinutes>60?[new Date(now.getTime()+45*60000)]:[])])all.push(...await search(state.from,state.to,t,20));const unique=new Map;for(const x of all)unique.set(`${x.dep.toISOString()}-${x.type}-${x.rawName}`,x);const max=new Date(now.getTime()+state.futureMinutes*60000);return[...unique.values()].filter(x=>x.dep>=start&&x.dep<=max).sort((a,b)=>a.dep-b.dep)}async function fullDay(){const now=new Date(),start=new Date(now);start.setHours(4,0,0,0);const all=[];for(let h=4;h<=22;h+=3){const t=new Date(start);t.setHours(h,0,0,0);all.push(...await search(state.from,state.to,t,20))}const unique=new Map;for(const x of all)unique.set(`${x.dep.toISOString()}-${x.type}-${x.rawName}`,x);const end=new Date(start);end.setDate(end.getDate()+1);end.setHours(3,59,59,999);return[...unique.values()].filter(x=>x.dep>=start&&x.dep<=end).sort((a,b)=>a.dep-b.dep)}function practical(trains){return trains.filter((tr,i)=>{const later=trains.slice(i+1).filter(x=>mins(tr.dep,x.dep)<=15);if(!tr.arr||!later.length)return true;const best=later.reduce((b,x)=>!b||x.arr<b.arr?x:b,null);if(!best?.arr)return true;return mins(best.arr,tr.arr)<state.arrivalGap})}function render(trains){const body=E("trainRows");if(!trains.length){body.innerHTML='<tr><td colspan="3" class="empty">表示できる列車がありません</td></tr>';return}body.innerHTML=trains.map(t=>{const time=`${String(t.dep.getHours()).padStart(2,"0")}:${String(t.dep.getMinutes()).padStart(2,"0")}`;return`<tr><td><span class="time">${time}</span><span class="type">${esc(t.type)}</span></td><td>${esc(t.weak)}</td><td class="${t.paid!=="—"?"paid":""}">${esc(t.paid)}</td></tr>`}).join("")}function notice(s=""){const n=E("notice");if(!s){n.classList.add("hidden");n.textContent="";return}n.textContent=s;n.classList.remove("hidden")}async function refresh(){E("nowLabel").textContent=`現在 ${pretty(new Date())}`;E("routeTitle").textContent=`${state.from} → ${state.to}`;E("modeLabel").textContent=state.mode==="full"?"終日表示":"現在時刻周辺";E("trainRows").innerHTML='<tr><td colspan="3" class="empty">読み込み中…</td></tr>';notice();if(!state.apiKey){render([]);notice('交通APIキーが未設定です。「設定」から駅すぱあと APIキーを入力すると、現在時刻を中心に実際のダイヤを取得します。AI APIは使用しません。');return}try{const raw=state.mode==="full"?await fullDay():await nearby();render(state.mode==="full"?raw:practical(raw))}catch(e){console.error(e);render([]);notice(String(e?.message||e).includes("Failed to fetch")?"ブラウザから交通APIへ直接接続できませんでした。公開時は同梱のserverless-proxy.jsをVercel/Cloudflare等に置く構成へ切り替えてください。":`交通データの取得に失敗しました（${e?.message||e}）。APIキーと契約プランを確認してください。`)}}document.querySelectorAll(".segment-button").forEach(btn=>btn.addEventListener("click",()=>{document.querySelectorAll(".segment-button").forEach(b=>b.classList.remove("active"));btn.classList.add("active");[state.from,state.to]=presets[btn.dataset.route];E("customPanel").classList.add("hidden");refresh()}));E("nearbyButton").onclick=()=>{state.mode="nearby";E("nearbyButton").classList.add("active");E("fullDayButton").classList.remove("active");refresh()};E("fullDayButton").onclick=()=>{state.mode="full";E("fullDayButton").classList.add("active");E("nearbyButton").classList.remove("active");refresh()};E("customButton").onclick=()=>E("customPanel").classList.toggle("hidden");E("swapButton").onclick=()=>{const a=E("fromInput").value;E("fromInput").value=E("toInput").value;E("toInput").value=a};E("applyCustomButton").onclick=()=>{const f=E("fromInput").value.trim(),t=E("toInput").value.trim();if(!f||!t||f===t)return;state.from=f;state.to=t;document.querySelectorAll(".segment-button").forEach(b=>b.classList.remove("active"));E("customPanel").classList.add("hidden");refresh()};E("refreshButton").onclick=refresh;const dlg=E("settingsDialog");E("settingsButton").onclick=()=>{E("apiKeyInput").value=state.apiKey;E("futureMinutesSelect").value=String(state.futureMinutes);E("arrivalGapSelect").value=String(state.arrivalGap);dlg.showModal()};E("saveSettingsButton").onclick=e=>{e.preventDefault();state.apiKey=E("apiKeyInput").value.trim();state.futureMinutes=Number(E("futureMinutesSelect").value);state.arrivalGap=Number(E("arrivalGapSelect").value);localStorage.setItem("ekispertApiKey",state.apiKey);localStorage.setItem("futureMinutes",String(state.futureMinutes));localStorage.setItem("arrivalGap",String(state.arrivalGap));dlg.close();refresh()};refresh();setInterval(()=>E("nowLabel").textContent=`現在 ${pretty(new Date())}`,30000);
  </script>
</body>
</html>
