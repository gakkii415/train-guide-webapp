<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f5f5f2"><title>Train Position</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;color:#171717;background:#f5f5f2}*{box-sizing:border-box}body{margin:0;background:#f5f5f2}button,input{font:inherit}.app{max-width:720px;margin:auto;padding:18px 12px 40px}.head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:14px}h1{margin:0;font-size:21px}.muted{color:#777;font-size:12px}.seg{display:grid;grid-template-columns:1fr 1fr;background:#e5e5e1;padding:3px;border-radius:12px}.seg button,.pill,.text,.swap{border:0;background:transparent}.seg button{padding:11px 6px;border-radius:9px;font-weight:650}.seg .on{background:#fff;box-shadow:0 1px 4px #0001}.tools{display:flex;gap:7px;overflow:auto;padding:10px 0}.pill{white-space:nowrap;background:#fff;border:1px solid #d8d8d3;border-radius:999px;padding:8px 11px;font-size:13px}.pill.on{background:#171717;color:#fff;border-color:#171717}.custom{background:#fff;border:1px solid #deded9;border-radius:13px;padding:12px;margin-bottom:10px}.hidden{display:none!important}.fields{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:end}label{display:grid;gap:5px;color:#777;font-size:11px}input{width:100%;min-width:0;padding:10px;border:1px solid #d5d5cf;border-radius:9px;background:#fafaf8}.swap{font-size:18px;padding:9px 4px}.primary{width:100%;margin-top:10px;padding:11px;border:0;border-radius:10px;background:#171717;color:#fff;font-weight:650}.status{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 8px}.status>div{display:flex;gap:8px;align-items:baseline}.text{padding:7px}.notice{padding:10px;background:#fffaf0;border:1px solid #dfd6b8;border-radius:10px;font-size:12px;line-height:1.5;margin-bottom:8px}.table{background:#fff;border:1px solid #deded9;border-radius:14px;overflow:hidden}table{border-collapse:collapse;width:100%;table-layout:fixed}th,td{padding:11px 8px;border-bottom:1px solid #ecece8;text-align:left}th{font-size:11px;color:#777;background:#fafaf8}td{font-size:13px}th:nth-child(1),td:nth-child(1){width:36%}th:nth-child(2),td:nth-child(2){width:31%}th:nth-child(3),td:nth-child(3){width:33%}tr:last-child td{border-bottom:0}.time{font-weight:700;font-variant-numeric:tabular-nums}.type{display:block;color:#555;font-size:11px;margin-top:2px}.empty{text-align:center;color:#888;padding:28px 8px}.note{font-size:11px;color:#777;line-height:1.5;margin:10px 2px}</style></head><body><main class="app"><div class="head"><h1>Train Position</h1><span id="now" class="muted"></span></div><div class="seg"><button class="on" data-r="ko">京都 → 大阪</button><button data-r="ok">大阪 → 京都</button></div><div class="tools"><button id="near" class="pill on">現在時刻周辺</button><button id="day" class="pill">終日表示</button><button id="other" class="pill">その他の区間</button></div><section id="custom" class="custom hidden"><div class="fields"><label>出発駅<input id="from" value="京都"></label><button id="swap" class="swap">⇄</button><label>到着駅<input id="to" value="大阪"></label></div><button id="apply" class="primary">この区間を表示</button></section><div class="status"><div><strong id="route">京都 → 大阪</strong><span id="mode" class="muted">現在時刻周辺</span></div><button id="refresh" class="text">更新</button></div><div id="notice" class="notice hidden"></div><div class="table"><table><thead><tr><th>時刻・種別</th><th>弱冷房車</th><th>有料座席</th></tr></thead><tbody id="rows"><tr><td colspan="3" class="empty">読み込み中…</td></tr></tbody></table></div><p class="note">現在時刻の15分前から表示。無料の非公式交通APIを使用しています。重要な移動時はJR公式情報も確認してください。</p></main><script>const E=id=>document.getElementById(id),API='https://api.transit.ls8h.com',S={from:'京都',to:'大阪',mode:'near',gap:15,future:90},P={ko:['京都','大阪'],ok:['大阪','京都']},C=new Map(),pad=n=>String(n).padStart(2,'0'),ymd=d=>''+d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate()),hm=d=>pad(d.getHours())+':'+pad(d.getMinutes()),mins=(a,b)=>Math.round((b-a)/6e4),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function nice(d){return new Intl.DateTimeFormat('ja-JP',{month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'}).format(d)}function secDate(ds,s){let d=new Date(+ds.slice(0,4),+ds.slice(4,6)-1,+ds.slice(6,8));d.setSeconds(s);return d}async function suggest(q){if(C.has(q))return C.get(q);let u=new URL(API+'/api/v1/locations/suggest');u.searchParams.set('q',q);u.searchParams.set('limit','10');let r=await fetch(u);if(!r.ok)throw Error('駅検索エラー');let a=(await r.json()).stations||[];C.set(q,a);return a}function rails(a){return a.filter(x=>x.kind==='station')}async function pair(a,b){let [x,y]=await Promise.all([suggest(a),suggest(b)]),xr=rails(x),yr=rails(y);for(let f of xr)for(let t of yr)if(f.feedId&&f.feedId===t.feedId)return[f,t];if(xr.length&&yr.length)return[xr[0],yr[0]];for(let f of x)for(let t of y)if(f.feedId&&f.feedId===t.feedId)return[f,t];if(!x.length||!y.length)throw Error('駅が見つかりません');return[x[0],y[0]]}async function plan(base,n=6){let [f,t]=await pair(S.from,S.to),u=new URL(API+'/api/v1/plan');for(let [k,v] of Object.entries({from:f.id,to:t.id,date:ymd(base),time:hm(base),type:'departure',allowModes:'rail',maxTransfers:'3',numItineraries:String(n)}))u.searchParams.set(k,v);let r=await fetch(u);if(!r.ok)throw Error('経路検索エラー');let j=await r.json();return(j.journeys||[]).map(x=>norm(j.date,x)).filter(Boolean)}function norm(ds,j){let ls=(j.legs||[]).filter(l=>l.kind!=='walk'&&l.mode!=='walk');if(!ls.length)return null;let txt=ls.map(l=>[l.routeName,l.headsign].filter(Boolean).join(' ')).join(' '),type=kind(txt,j),dep=secDate(ds,j.departureSecs),arr=secDate(ds,j.arrivalSecs);return{dep,arr,type,weak:weak(type,txt),paid:paid(txt),raw:txt}}function kind(t,j){if(/新快速/.test(t))return'新快速';if(/快速/.test(t))return'快速';if(/普通|各駅/.test(t))return'普通';if(/特急/.test(t))return'特急';if((S.from==='京都'&&S.to==='大阪')||(S.from==='大阪'&&S.to==='京都')){let m=Math.round(j.durationSecs/60);return m<=33?'新快速':m<=46?'快速':'普通'}return t.split(' ')[0]||'列車'}function weak(k,t){if(k==='普通')return'○2・○6';if(/12両/.test(t))return'△2・△11';if(/8両/.test(t))return'△2・△7';if(k==='新快速'||k==='快速')return'△2・△7/11';return'要確認'}function paid(t){if(/Aシート/.test(t))return'△9（Aシート）';if(/うれしート/.test(t))return'最後部（うれしート）';return'—'}async function nearby(){let now=new Date,start=new Date(now-9e5),all=[];for(let p of [start,new Date(now.getTime()+25*6e4),new Date(now.getTime()+55*6e4)])try{all.push(...await plan(p))}catch(e){}let m=new Map;for(let x of all)m.set(x.dep.getTime()+'|'+x.type+'|'+x.raw,x);let max=new Date(now.getTime()+S.future*6e4);return[...m.values()].filter(x=>x.dep>=start&&x.dep<=max).sort((a,b)=>a.dep-b.dep)}async function full(){let now=new Date,all=[];for(let h=5;h<=23;h+=2){let p=new Date(now);p.setHours(h,0,0,0);try{all.push(...await plan(p))}catch(e){}}let m=new Map;for(let x of all)m.set(x.dep.getTime()+'|'+x.type+'|'+x.raw,x);return[...m.values()].sort((a,b)=>a.dep-b.dep)}function practical(a){return a.filter((x,i)=>{let l=a.slice(i+1).filter(y=>mins(x.dep,y.dep)<=15);if(!l.length)return true;let b=l.reduce((q,y)=>!q||y.arr<q.arr?y:q,null);return mins(b.arr,x.arr)<S.gap})}function render(a){E('rows').innerHTML=a.length?a.map(x=>`<tr><td><span class="time">${hm(x.dep)}</span><span class="type">${esc(x.type)}</span></td><td>${esc(x.weak)}</td><td>${esc(x.paid)}</td></tr>`).join(''):'<tr><td colspan="3" class="empty">候補がありません</td></tr>'}function msg(t=''){E('notice').textContent=t;E('notice').classList.toggle('hidden',!t)}async function load(){E('now').textContent='現在 '+nice(new Date);E('route').textContent=S.from+' → '+S.to;E('mode').textContent=S.mode==='day'?'終日表示':'現在時刻周辺';E('rows').innerHTML='<tr><td colspan="3" class="empty">読み込み中…</td></tr>';msg();try{let a=S.mode==='day'?await full():await nearby();render(S.mode==='day'?a:practical(a))}catch(e){render([]);msg('無料交通APIから取得できませんでした。通信状態を確認して更新してください。')}}document.querySelectorAll('.seg button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));b.classList.add('on');[S.from,S.to]=P[b.dataset.r];E('custom').classList.add('hidden');load()});E('near').onclick=()=>{S.mode='near';E('near').classList.add('on');E('day').classList.remove('on');load()};E('day').onclick=()=>{S.mode='day';E('day').classList.add('on');E('near').classList.remove('on');load()};E('other').onclick=()=>E('custom').classList.toggle('hidden');E('swap').onclick=()=>{let a=E('from').value;E('from').value=E('to').value;E('to').value=a};E('apply').onclick=()=>{let a=E('from').value.trim(),b=E('to').value.trim();if(!a||!b||a===b)return;S.from=a;S.to=b;document.querySelectorAll('.seg button').forEach(x=>x.classList.remove('on'));E('custom').classList.add('hidden');load()};E('refresh').onclick=load;load();setInterval(()=>E('now').textContent='現在 '+nice(new Date),3e4);</script></body></html>
